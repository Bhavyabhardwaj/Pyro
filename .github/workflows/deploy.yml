name: Deploy Backend

on:
  push:
    branches:
      - main

    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/Pyro

            git pull origin main

            cd backend

            npm install

            npx prisma generate

            npm run build

            pm2 restart pyro-backend